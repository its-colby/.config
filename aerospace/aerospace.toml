after-startup-command = []

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

# Bindings match I-layer chords from Goku/ZMK (Alt+Shift+…).
# T→q accordion | S→w tiles/split toggle | R→s float | N→a swap
# L→d focus left | Space→f focus right | D→c smaller | W→v bigger
[mode.main.binding]

    alt-shift-space = 'close --quit-if-last-window'

    alt-shift-d = 'focus --boundaries-action wrap-around-the-workspace left'
    alt-shift-f = 'focus --boundaries-action wrap-around-the-workspace right'

    # width-ish smart resize (Aerospace reflows siblings)
    alt-shift-c = 'resize smart -50'
    alt-shift-v = 'resize smart +50'

    # Accordion: one window fills; focus L/R cycles
    alt-shift-q = 'layout accordion horizontal vertical'

    # Split/tiles: tiling layout; repeat toggles orientation (H↔V)
    alt-shift-w = 'layout tiles horizontal vertical'

    # Float / disorganized Mac-style
    alt-shift-s = 'layout floating tiling'

    # Swap / cycle focused with neighbor
    alt-shift-a = 'swap --wrap-around right'
