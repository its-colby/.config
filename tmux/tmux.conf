# =============================================================================
# PREFIX
# =============================================================================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# =============================================================================
# SESSIONS
# =============================================================================
bind X kill-session
bind g kill-session
bind -n F5 kill-session
bind d detach-client

unbind '"'
unbind %

# =============================================================================
# WINDOWS/PANES
# =============================================================================
bind -n C-M-w if-shell -F '#{==:#{window_panes},1}' 'kill-window' 'kill-pane'

bind -n C-M-g new-window
bind -n C-M-f select-pane -t :.+
bind -n C-M-d select-pane -t :.-
bind -n C-M-s next-window
bind -n C-M-a previous-window

bind -n C-M-r split-window -h
bind -n C-M-e split-window -v


# =============================================================================
# MISC
# =============================================================================
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "screen-256color"
set -g mouse on

# =============================================================================
# Minimal Tokyo Night status bar
# =============================================================================
set -g status-position top
set -g status-style 'bg=#16161e fg=#565f89'
set -g status-left-length 24
set -g status-left '#[fg=#7aa2f7,bold] #{session_name} #[fg=#414868]| '
set -g status-right '#[fg=#414868]%H:%M '
setw -g window-status-format ' #[fg=#565f89]#I:#W '
setw -g window-status-current-format ' #[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W '
setw -g window-status-separator ''
